name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Optional one-job runner: only a reviewed exact SHA in this repository.
    # Empty/unmatched variables retain the normal GitHub-hosted Linux path.
    runs-on: ${{ (vars.SABAH_CI_RUNNER != '' && vars.SABAH_CI_HEAD == (github.event.pull_request.head.sha || github.sha) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.SABAH_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: ${{ !(vars.SABAH_CI_RUNNER != '' && vars.SABAH_CI_HEAD == (github.event.pull_request.head.sha || github.sha) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: departmenthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ (vars.SABAH_CI_RUNNER != '' && vars.SABAH_CI_HEAD == (github.event.pull_request.head.sha || github.sha) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'postgresql://postgres@127.0.0.1:55466/departmenthub_ci_test' || 'postgresql://postgres:postgres@127.0.0.1:5432/departmenthub_test' }}
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations to CI database
        run: npx prisma migrate deploy
      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Public documentation
        run: npm run docs:check
      - name: Unit and integration tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
