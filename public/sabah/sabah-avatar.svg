<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Sabah employee copilot">
  <!-- Sabah: mature, modest illustrated Saudi colleague. Flat vector, transparent background. -->
  <!-- Hair covering (modest) -->
  <path d="M48 12c-16 0-26 11-26 27 0 3 .2 6 .8 9H30c-1.5-4-2-8-1.6-12C29.5 24 37.5 18 48 18s18.5 6 19.6 18c.4 4-.1 8-1.6 12h7.2c.6-3 .8-6 .8-9 0-16-10-27-26-27z" fill="#5B4B8A" opacity="0.92"/>
  <!-- Face -->
  <ellipse cx="48" cy="45" rx="17" ry="19" fill="#F3C9A5"/>
  <!-- Head covering side drape -->
  <path d="M26 38c-2 10 0 20 4 27 3 5 8 8 18 8s15-3 18-8c4-7 6-17 4-27-3 4-8 6-22 6s-19-2-22-6z" fill="#6C5AA0"/>
  <!-- Simplified facial detail: eyes -->
  <circle cx="41" cy="45" r="1.8" fill="#3D3350"/>
  <circle cx="55" cy="45" r="1.8" fill="#3D3350"/>
  <!-- Gentle smile -->
  <path d="M43 53c1.6 1.6 3.2 2.2 5 2.2s3.4-.6 5-2.2" stroke="#B08360" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- Eyebrows -->
  <path d="M38.5 40.5c1.5-1 3-1.4 4.5-1" stroke="#4A3E63" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M53 39.5c1.5-.4 3 0 4.5 1" stroke="#4A3E63" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Collar / thobe top -->
  <path d="M24 88c2-11 11-17 24-17s22 6 24 17v8H24v-8z" fill="#F7F5F0"/>
  <!-- Collar accent (teal) -->
  <path d="M44 71.5c1.3 1.5 2.6 2 4 2s2.7-.5 4-2c-1.3-1-2.6-1.4-4-1.4s-2.7.4-4 1.4z" fill="#2E8B8B"/>
  <!-- Violet shoulder accent -->
  <path d="M24 88c.4-2.3 1-4.4 1.8-6.4L34 78l-2 18h-8v-8z" fill="#5B4B8A" opacity="0.25"/>
  <path d="M72 88c-.4-2.3-1-4.4-1.8-6.4L62 78l2 18h8v-8z" fill="#5B4B8A" opacity="0.25"/>
</svg>
